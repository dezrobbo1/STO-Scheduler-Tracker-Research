name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  field:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: field
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: field/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - run: npx cap sync ios
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./android/gradlew -p android assembleDebug
      - run: ./android/gradlew -p android assembleAndroidTest

  field-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: field
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: field/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

  api:
    # The persistence gate: needs PostgreSQL and the api extra. The bare job
    # below proves the suite still runs with nothing installed.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --extra api --extra test --extra browser
      - name: persistence gate and the rest of the suite, with absence a failure
        env:
          STO_REQUIRE_DB: "1"
          STO_TEST_ADMIN_URL: postgresql://postgres@127.0.0.1:5433/postgres
        run: PYTHONPATH=src .venv/bin/python -m unittest discover -s tests -v
      - name: migrations apply cleanly and the drift guard is green on a fresh database
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5433"
          PGUSER: postgres
          PGDATABASE: sto_ci
        run: |
          psql -d postgres -c 'CREATE DATABASE sto_ci'
          scripts/db/apply-migrations.sh
          scripts/db/check-schema-drift.sh
      - name: install browser for PL14 acceptance
        run: .venv/bin/playwright install --with-deps chromium
      - name: authenticated PL14 workflow survives logout and application restart
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5433"
          PGUSER: postgres
          PGDATABASE: sto_browser
          STO_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/sto_browser
          STO_REQUIRE_DB: "1"
        run: |
          psql -d postgres -c 'CREATE DATABASE sto_browser'
          scripts/db/apply-migrations.sh
          PYTHONPATH=src .venv/bin/python scripts/browser-acceptance-pl14.py
      - name: upload PL2 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl2-browser-evidence
          path: artifacts/pl2-browser

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The declared floor in pyproject.toml, and the version used locally.
        # Testing only one hides "green on 3.13, broken on 3.12".
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m compileall -q src scripts tests
      - name: Check committed diff for whitespace errors
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git show --check --format=oneline --no-renames HEAD
          fi


  ios-simulator:
    runs-on: macos-latest
    env:
      STO_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DERIVED_DATA: /tmp/pl5-ios-derived
      EVIDENCE: artifacts/pl5-cloud-ios-simulator

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: field/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build web assets and sync the committed iOS project
        working-directory: field
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
          npx cap sync ios

      - name: Record Xcode and exact-source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD | tee "$EVIDENCE/source-sha.txt"
          test "$(git rev-parse HEAD)" = "$STO_BUILD_SHA"
          xcodebuild -version | tee "$EVIDENCE/xcode-version.txt"
          xcrun simctl list runtimes available | tee "$EVIDENCE/available-runtimes.txt"

      - name: Select and boot an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True,
          ))
          candidates = []
          for runtime, devices in payload.get("devices", {}).items():
              if ".SimRuntime.iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in re.findall(r"\d+", runtime))
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((version, device["name"], runtime, device["udid"]))
          if not candidates:
              raise SystemExit("no available iPhone simulator runtime/device")
          version, name, runtime, udid = sorted(candidates, reverse=True)[0]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"SIM_UDID={udid}\n")
              handle.write(f"SIM_NAME={name}\n")
              handle.write(f"SIM_RUNTIME={runtime}\n")
          with open(os.path.join(os.environ["EVIDENCE"], "simulator.txt"), "w", encoding="utf-8") as handle:
              handle.write(f"name={name}\nruntime={runtime}\nudid={udid}\n")
          PY

      - name: Boot the selected iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Build the exact app for iOS Simulator without distribution signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project field/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$EVIDENCE/xcodebuild.log"

      - name: Install, launch and capture simulator evidence
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"

          INFO="$APP_PATH/Info.plist"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")"

          test "$BUNDLE_ID" = "au.com.sto.fieldtrial"
          test "$VERSION" = "1.0"
          test "$BUILD" = "1"
          test -f "$APP_PATH/$EXECUTABLE"

          {
            echo "source_sha=$STO_BUILD_SHA"
            echo "app_path=$APP_PATH"
            echo "bundle_id=$BUNDLE_ID"
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "simulator=$SIM_NAME"
            echo "runtime=$SIM_RUNTIME"
          } | tee "$EVIDENCE/app-metadata.txt"
          shasum -a 256 "$APP_PATH/$EXECUTABLE" | tee "$EVIDENCE/app-executable.sha256"

          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl get_app_container "$SIM_UDID" "$BUNDLE_ID" app \
            | tee "$EVIDENCE/app-container.txt"

          launch_output="$(xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID")"
          printf '%s\n' "$launch_output" | tee "$EVIDENCE/launch.txt"
          sleep 8

          xcrun simctl spawn "$SIM_UDID" ps -A -o pid=,comm= \
            | tee "$EVIDENCE/processes.txt"
          if ! grep -Eq '[/ ]App$' "$EVIDENCE/processes.txt"; then
            echo "STO Field Trial process did not remain alive after launch" >&2
            exit 1
          fi

          xcrun simctl io "$SIM_UDID" screenshot "$EVIDENCE/launch.png"
          xcrun simctl spawn "$SIM_UDID" log show --style compact --last 3m \
            --predicate 'process == "App"' > "$EVIDENCE/app.log" 2>&1 || true

      - name: Upload iOS simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl5-cloud-ios-simulator
          path: artifacts/pl5-cloud-ios-simulator
          if-no-files-found: warn
