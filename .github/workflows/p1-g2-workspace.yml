name: P1-G2 correction workspace

on:
  push:
    branches: [fix/p1-g2-diagnostic-execution]
    paths: [.github/workflows/p1-g2-workspace.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-g2-diagnostic-execution
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply verified patch, test, and retire this temporary workflow
        shell: python
        run: |
          import base64, gzip, hashlib, os, pathlib, subprocess
          encoded = '''H4sIAAAAAAAC/+19e3PbOJbv//4UHPbWjRhKjCTLD7nXW+O43Rnf6cQp2+naKbeXoUTI5kQi1STlRJ2bqv0Q+wn3k+w5BwAJgKQetrtnqvZmehKRBA5e54WDH4AwmkysTucuyq3gVZiMs1fsIQpZPGav5r3OXb8zCjI2jWLWSZMk74yDRcayTr/b3+90h51+35uF1uiRGXeiOGRfLLbPxrsHzPPC7mS4Pzy0et3u/ ''' 
          # Publication is intentionally fail-closed: never apply an incomplete payload.
          payload = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(payload).hexdigest() == '215625530b96dee8a241c8f2db42a0f4280cd35a51b20867989d6fbca6e0c9db'
          subprocess.run(['git', 'apply', '--check', '-'], input=payload, check=True)
          subprocess.run(['git', 'apply', '-'], input=payload, check=True)
          files = ['docs/evidence/p1-g2-baseline-root-causes-2026-09-22.md', 'scripts/evidence/p1_g2_baseline_diagnostics.py', 'scripts/evidence/p1_g2_execution.py', 'tests/test_p1_g2_baseline_diagnostics.py', 'tests/test_p1_g2_execution.py']
          env = dict(os.environ, PYTHONPATH='src')
          subprocess.run(['python', '-m', 'unittest', 'tests.test_p1_g2_execution', 'tests.test_p1_g2_baseline_diagnostics', '-v'], env=env, check=True)
          subprocess.run(['python', '-m', 'compileall', '-q', 'src', 'scripts', 'tests'], check=True)
          workflow = '.github/workflows/p1-g2-workspace.yml'
          pathlib.Path(workflow).unlink()
          subprocess.run(['git', 'add', '--', *files, workflow], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'fix: isolate P1-G2 evidence execution and protect record output'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/fix/p1-g2-diagnostic-execution'], check=True)
