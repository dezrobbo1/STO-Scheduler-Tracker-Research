name: PR56 pinned replay transfer
on:
  push:
    branches: [fix/p1-g2-diagnostic-execution]
    paths: [.github/workflows/p1-g2-replay-transfer.yml]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 95e4ac6481cbca57953deb38892e5d82b9457256
          persist-credentials: false
      - name: Package pinned source and encrypt the external fixture
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$RUNNER_TEMP/sto-pr56-transfer"
          out="$RUNNER_TEMP/sto-pr56-transfer"
          git archive --format=zip HEAD > "$out/source-95e4ac6.zip"
          cat > "$work/public.pem" <<'PUBLIC'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAsIk2XuEzCY3bopyH/Ent
          GWDnIRg7XSPoiE0oE8D0ho0jbqvgaG8VeweKSEOMplJsqlIY1Tnxc2lHQ7Hg2f/n
          xMhL/UFaiHlSEijYNIejT80jLZ3Mym5qKazP59ypeDtfU9RCzrIVPORhSgyyUonW
          Ix8gIpos8dMF2R9sOtk86/mU6yHMX0bY9TcV8AG/E/1f6izqzeDQ9lKLJw5bXBXp
          jAggDsdS9tJSF8Maf20AznGmqlderzABEDIG7zEDKGungdQakNUF5LKPUtwySXij
          +fDHen6dMXMMelzIEZkXZBeg6Jt8ahT/q+/XndUMdcj/Bat63OLmwu9BWFiJrbho
          elPcqxmb34Zcokwl7AVhCU/SLNDJyxtMbGa/Tey6wt3a6xECqzfTOlPHAXuR+28z
          5reVVHHhv68K3BHSB4eX2CjKLq6IQZ33REpFPdDdUoxq/e6WdqQT0vH2JdUQGyXm
          JfnvTfYExHNHYf+m+rDzmJ2gYDjDqjvOHIly+fX3P4JjAgMBAAE=
          -----END PUBLIC KEY-----
          PUBLIC
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/dezrobbo1/Shutdown-Tracker-Claude/135218f6f3a6f6fe91ce193d0ee3776ebf0eedbe/fixtures/project-files/boiler/boiler-before-no-progress.xml' \
            --output "$work/baseline.xml"
          test "$(wc -c < "$work/baseline.xml")" -eq 3361935
          printf '%s  %s\n' 'e9b9b7994cc5cc50479807b82c452da742a91de9f7de52b172a6be6f4f399c70' "$work/baseline.xml" | sha256sum --check --status
          openssl rand -base64 32 > "$work/password"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$work/baseline.xml" -out "$out/baseline.xml.enc" \
            -pass "file:$work/password"
          openssl pkeyutl -encrypt -pubin -inkey "$work/public.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$work/password" -out "$out/baseline.password.enc"
          printf 'Pinned source and hash-verified encrypted fixture prepared. No raw fixture is uploaded.\n'
      - uses: actions/upload-artifact@v4
        with:
          name: sto-pr56-replay-inputs-95e4ac6
          path: ${{ runner.temp }}/sto-pr56-transfer/
          if-no-files-found: error
          retention-days: 1
