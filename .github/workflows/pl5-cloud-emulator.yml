name: PL5 cloud mobile

on:
  pull_request:
    paths:
      - "field/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/sto/**"
      - "infra/migrations/**"
      - "scripts/db/**"
      - "scripts/setup-pl5-cloud-emulator.py"
      - "scripts/serve-pl5-cloud-emulator.py"
      - "scripts/run-pl5-cloud-emulator.sh"
      - "tests/fixtures/synthetic-workspace-chain.mspdi.xml"
      - ".github/workflows/pl5-cloud-emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pl5-cloud-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5433"
      PGUSER: postgres
      PGDATABASE: sto_emulator
      STO_DATABASE_URL: postgresql://postgres@127.0.0.1:5433/sto_emulator
      STO_REQUIRE_DB: "1"
      STO_SOURCE_DIR: /tmp/sto-pl5-emulator-source
      STO_EMULATOR_SETUP_FILE: /tmp/sto-pl5-emulator-setup.json
      STO_EMULATOR_TLS_DIR: /tmp/sto-pl5-emulator-tls
      STO_EMULATOR_TLS_CA: /tmp/sto-pl5-emulator-tls/ca.crt
      STO_EMULATOR_TLS_CERT: /tmp/sto-pl5-emulator-tls/server.crt
      STO_EMULATOR_TLS_KEY: /tmp/sto-pl5-emulator-tls/server.key
      STO_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: field/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      - name: Install locked application dependencies
        run: uv sync --frozen --extra api

      - name: Run field unit tests and build web assets
        working-directory: field
        run: |
          npm ci
          npm test
          npm run build

      - name: Prepare disposable PostgreSQL
        run: |
          psql -d postgres -c 'CREATE DATABASE sto_emulator'
          scripts/db/apply-migrations.sh
          scripts/db/check-schema-drift.sh

      - name: Create ephemeral authentication key
        shell: bash
        run: |
          key="$(.venv/bin/python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          echo "::add-mask::$key"
          echo "STO_AUTH_MASTER_KEY=$key" >> "$GITHUB_ENV"

      - name: Create disposable PL5 emulator project and device identities
        run: |
          mkdir -p "$STO_SOURCE_DIR"
          .venv/bin/python scripts/setup-pl5-cloud-emulator.py

      - name: Create ephemeral TLS identity for emulator host bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STO_EMULATOR_TLS_DIR"
          openssl genrsa -out "$STO_EMULATOR_TLS_DIR/ca.key" 2048
          openssl req -x509 -new -key "$STO_EMULATOR_TLS_DIR/ca.key"             -sha256 -days 1 -subj "/CN=PL5 Cloud Emulator CI CA"             -out "$STO_EMULATOR_TLS_CA"
          openssl genrsa -out "$STO_EMULATOR_TLS_KEY" 2048
          openssl req -new -key "$STO_EMULATOR_TLS_KEY"             -subj "/CN=10.0.2.2" -out "$STO_EMULATOR_TLS_DIR/server.csr"
          cat > "$STO_EMULATOR_TLS_DIR/server.ext" <<'EOF'
          subjectAltName=IP:10.0.2.2,IP:127.0.0.1,DNS:localhost
          extendedKeyUsage=serverAuth
          EOF
          openssl x509 -req -in "$STO_EMULATOR_TLS_DIR/server.csr"             -CA "$STO_EMULATOR_TLS_CA" -CAkey "$STO_EMULATOR_TLS_DIR/ca.key"             -CAcreateserial -out "$STO_EMULATOR_TLS_CERT" -days 1 -sha256             -extfile "$STO_EMULATOR_TLS_DIR/server.ext"
          chmod 600 "$STO_EMULATOR_TLS_DIR/ca.key" "$STO_EMULATOR_TLS_KEY"

      - name: Prepare Android debug trust for disposable CI CA
        shell: bash
        run: |
          set -euo pipefail
          cd field
          npx cap sync android
          mkdir -p android/app/src/debug/res/raw android/app/src/debug/res/xml
          cp "$STO_EMULATOR_TLS_CA" android/app/src/debug/res/raw/pl5_ci_ca.crt
          cat > android/app/src/debug/res/xml/pl5_ci_network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="false">
              <trust-anchors>
                <certificates src="system" />
                <certificates src="@raw/pl5_ci_ca" />
              </trust-anchors>
            </base-config>
          </network-security-config>
          EOF
          cat > android/app/src/debug/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:usesCleartextTraffic="false"
              android:networkSecurityConfig="@xml/pl5_ci_network_security_config" />
          </manifest>
          EOF

      - name: Build app and instrumented-test APKs
        run: ./field/android/gradlew -p field/android assembleDebug assembleAndroidTest

      - name: Run cloud emulator convergence smoke
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/run-pl5-cloud-emulator.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl5-cloud-emulator
          path: artifacts/pl5-cloud-emulator
          if-no-files-found: warn


  ios-simulator:
    runs-on: macos-latest
    env:
      STO_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DERIVED_DATA: ${{ runner.temp }}/pl5-ios-derived
      EVIDENCE: artifacts/pl5-cloud-ios-simulator

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: field/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build web assets and sync the committed iOS project
        working-directory: field
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
          npx cap sync ios

      - name: Record Xcode and exact-source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD | tee "$EVIDENCE/source-sha.txt"
          test "$(git rev-parse HEAD)" = "$STO_BUILD_SHA"
          xcodebuild -version | tee "$EVIDENCE/xcode-version.txt"
          xcrun simctl list runtimes available | tee "$EVIDENCE/available-runtimes.txt"

      - name: Select and boot an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True,
          ))
          candidates = []
          for runtime, devices in payload.get("devices", {}).items():
              if ".SimRuntime.iOS-" not in runtime:
                  continue
              version = tuple(int(part) for part in re.findall(r"\d+", runtime))
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((version, device["name"], runtime, device["udid"]))
          if not candidates:
              raise SystemExit("no available iPhone simulator runtime/device")
          version, name, runtime, udid = sorted(candidates, reverse=True)[0]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"SIM_UDID={udid}\n")
              handle.write(f"SIM_NAME={name}\n")
              handle.write(f"SIM_RUNTIME={runtime}\n")
          with open(os.path.join(os.environ["EVIDENCE"], "simulator.txt"), "w", encoding="utf-8") as handle:
              handle.write(f"name={name}\nruntime={runtime}\nudid={udid}\n")
          PY
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Build the exact app for iOS Simulator without distribution signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project field/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$EVIDENCE/xcodebuild.log"

      - name: Install, launch and capture simulator evidence
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP_PATH"

          INFO="$APP_PATH/Info.plist"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO")"

          test "$BUNDLE_ID" = "au.com.sto.fieldtrial"
          test "$VERSION" = "1.0"
          test "$BUILD" = "1"
          test -f "$APP_PATH/$EXECUTABLE"

          {
            echo "source_sha=$STO_BUILD_SHA"
            echo "app_path=$APP_PATH"
            echo "bundle_id=$BUNDLE_ID"
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "simulator=$SIM_NAME"
            echo "runtime=$SIM_RUNTIME"
          } | tee "$EVIDENCE/app-metadata.txt"
          shasum -a 256 "$APP_PATH/$EXECUTABLE" | tee "$EVIDENCE/app-executable.sha256"

          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl get_app_container "$SIM_UDID" "$BUNDLE_ID" app \
            | tee "$EVIDENCE/app-container.txt"

          launch_output="$(xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID")"
          printf '%s\n' "$launch_output" | tee "$EVIDENCE/launch.txt"
          sleep 8

          xcrun simctl spawn "$SIM_UDID" ps -A -o pid=,comm= \
            | tee "$EVIDENCE/processes.txt"
          if ! grep -Eq '[/ ]App$' "$EVIDENCE/processes.txt"; then
            echo "STO Field Trial process did not remain alive after launch" >&2
            exit 1
          fi

          xcrun simctl io "$SIM_UDID" screenshot "$EVIDENCE/launch.png"
          xcrun simctl spawn "$SIM_UDID" log show --style compact --last 3m \
            --predicate 'process == "App"' > "$EVIDENCE/app.log" 2>&1 || true

      - name: Upload iOS simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl5-cloud-ios-simulator
          path: artifacts/pl5-cloud-ios-simulator
          if-no-files-found: warn
