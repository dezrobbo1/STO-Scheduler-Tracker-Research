[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sto-scheduler-core"
version = "0.1.1"
description = "Research-only STO schedule importer, scheduler, and local workspace"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sto-scheduler-core = "sto_scheduler_core.cli:main"
sto-scheduler-workspace = "sto_scheduler_core.workspace_server:workspace_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sto_scheduler_core = ["workspace_static/*.html", "workspace_static/*.css", "workspace_static/*.js"]
