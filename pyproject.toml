[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sto"
version = "1.0.0.dev0"
description = "STO: shutdown/turnaround scheduler with CMMS, P6 and Microsoft Project interchange"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sto = "sto.cli:main"
sto-legacy = "sto.legacy.cli:main"
sto-workspace = "sto.legacy.workspace_server:workspace_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sto.legacy" = ["workspace_static/*.html", "workspace_static/*.css", "workspace_static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/sto/legacy/*" = ["E501", "B", "UP"]
