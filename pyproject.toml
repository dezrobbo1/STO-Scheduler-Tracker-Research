[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sto"
version = "1.0.0.dev0"
description = "STO: shutdown/turnaround scheduler with CMMS, P6 and Microsoft Project interchange"
requires-python = ">=3.12"
dependencies = []

# Everything the API needs and nothing the core does. ADR-005: the base package,
# the suite and CI stay stdlib-only; this is installed only where the API runs.
[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "python-multipart>=0.0.9",
]
# Test-only: the HTTP test client the API's tests drive the app with.
test = [
    "httpx2>=0.1",
]

[project.scripts]
sto = "sto.cli:main"
sto-legacy = "sto.legacy.cli:main"
sto-workspace = "sto.legacy.workspace_server:workspace_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sto.legacy" = ["workspace_static/*.html", "workspace_static/*.css", "workspace_static/*.js"]
"sto.conformance" = ["MANIFEST.json", "corpus/README.md", "corpus/catalogue.csv", "corpus/cases/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/sto/legacy/*" = ["E501", "B", "UP"]
