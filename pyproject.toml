[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sto-scheduler-core"
version = "0.1.1"
description = "Research STO schedule model, MSPDI importer, and local scenario workspace"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sto-scheduler-core = "sto_scheduler_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sto_scheduler_core = ["workspace_web/*.html", "workspace_web/*.css", "workspace_web/*.js"]
